[project]
name = "plumi"
version = "0.3.0"
description = "Thin pulumi wrapper: per-environment state backends and credentials preflight"
license = "MIT"
requires-python = ">=3.14"

dependencies = [
    "botocore",
]

[project.scripts]
plumi = "plumi.tools.plumi:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[build-system]
requires = ["uv_build >= 0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 90
